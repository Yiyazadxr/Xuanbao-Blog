name: 功能建议 / Feature request
description: 新功能、体验改进或内容建议
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        中文或英文都可以。Chinese or English, either is fine.

        本项目是中文个人博客系统，改动需要与现有定位、权限模型和界面风格一致；建议先看 [README](https://github.com/Yiyazadxr/Xuanbao-blog/blob/main/README.md) 与 [CONTRIBUTING](https://github.com/Yiyazadxr/Xuanbao-blog/blob/main/CONTRIBUTING.md)。
        This is a personal blog project; proposals should fit its scope, permission model and UI style.
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / The problem
      description: 现在的体验是什么样，哪里不够用
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的效果 / Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives considered（可选）
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 补充说明 / Additional context（可选）
      description: 参考链接、截图等
    validations:
      required: false
  - type: checkboxes
    id: pr
    attributes:
      label: 参与意愿 / Willingness to contribute
      options:
        - label: 我愿意提交 Pull Request 实现这个建议 / I am willing to submit a pull request
          required: false
